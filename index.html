<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPE 競馬予想エンジン v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:780px;margin:auto;padding:20px}header{background:#152b51;color:white;padding:20px;border-radius:16px}h1{font-size:23px;margin:0 0 5px}.sub{opacity:.8;font-size:13px}.panel{background:white;border-radius:14px;padding:17px;margin-top:15px;box-shadow:0 2px 10px #13223b12}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{box-sizing:border-box;width:100%;border:1px solid #ccd3df;border-radius:8px;padding:11px;font-size:16px;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.six label{font-size:11px}.six input{padding:8px}button{border:0;border-radius:10px;padding:12px 16px;background:#245bc4;color:white;font-weight:700;font-size:15px;margin:8px 8px 0 0}.secondary{background:#e7ebf3;color:#243654}.danger{background:#a52c42}.horse{border-top:1px solid #e6e9f0;padding:12px 0}.small{font-size:12px;color:#657084}.rank{font-size:18px;font-weight:700}.bar{height:9px;background:#e8edf6;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#3168d5}#status{color:#8a3044;font-size:13px}.notice{font-size:12px;color:#59667b;line-height:1.7}footer{padding:18px 0;font-size:12px;color:#6b7280}</style></head><body><main><header><h1>🐎 PPE 競馬予想エンジン</h1><div class="sub">Pちゃん競馬塾 · 試作 Ver.0.1</div></header><section class="panel"><h2>レース設定</h2><div class="grid"><div><label for="race">レース名</label><input id="race" value="テストレース"></div><div><label for="mode">レース区分</label><select id="mode"><option value="lower">下級条件</option><option value="graded">重賞</option></select></div></div><div class="grid"><div><label for="temp">温度 T（未校正）</label><input id="temp" type="number" min="0.1" max="100" step="0.5" value="8"></div><div><label for="scenario">展開シナリオ</label><select id="scenario"><option value="M">ミドル</option><option value="S">スロー</option><option value="H">ハイ</option></select></div></div><p class="notice">各項目0〜5点。展開適性は選んだ展開での評価点を入力。現段階では展開別の発生確率を統合していません。</p></section><section class="panel"><h2>出走馬を採点</h2><div id="horses"></div><button id="add">＋ 馬を追加</button><button class="secondary" id="sample">サンプルを読み込む</button><button class="danger" id="clear">全消去</button></section><section class="panel"><h2>勝率計算</h2><button id="calc">計算する</button><p id="status"></p><div id="results"></div><p class="notice">表示する勝率は試作の数理モデルによる未校正値で、実際の勝率を保証しません。オッズや馬券購入判断にはそのまま使わないでください。</p></section><footer>データはこのページ内でのみ扱います。保存・自動取得機能は未実装です。</footer></main><script>
const keys=['ability','change','position','condition','course','pace'];const labels=['基礎能力','前走からの変化','位置取り','状態・ローテ','コース・馬場','展開適性'];const weights={lower:[25,15,10,15,15,20],graded:[30,10,15,15,15,15]};let horses=[];const el=id=>document.getElementById(id);function addHorse(name='',scores=[3,3,3,3,3,3]){horses.push({id:crypto.randomUUID(),name,scores});render()}function render(){el('horses').innerHTML=horses.map((h,i)=>`<div class="horse" data-id="${h.id}"><label>馬 ${i+1} の名前</label><input class="name" value="${escapeHTML(h.name)}" placeholder="馬名"><div class="six">${labels.map((l,j)=>`<div><label>${l}</label><input class="score" data-j="${j}" type="number" min="0" max="5" step="0.5" value="${h.scores[j]}"></div>`).join('')}</div><button class="secondary remove">この馬を削除</button></div>`).join('');document.querySelectorAll('.horse').forEach(node=>{let h=horses.find(x=>x.id===node.dataset.id);node.querySelector('.name').addEventListener('input',e=>h.name=e.target.value);node.querySelectorAll('.score').forEach(inp=>inp.addEventListener('input',e=>h.scores[+inp.dataset.j]=e.target.value===''?NaN:Number(e.target.value)));node.querySelector('.remove').addEventListener('click',()=>{horses=horses.filter(x=>x.id!==h.id);render()})})}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}el('add').onclick=()=>addHorse();el('sample').onclick=()=>{horses=[];[['A馬',[4.5,4,3.5,4,4.5,4]],['B馬',[4,3,4.5,4,4,3.5]],['C馬',[3.5,4.5,3,4,3.5,4.5]],['D馬',[3,3.5,4,3,4,3]],['E馬',[3,3,3,3.5,3,3.5]]].forEach(([name,scores])=>horses.push({id:crypto.randomUUID(),name,scores}));render();el('results').innerHTML=''};el('clear').onclick=()=>{horses=[];render();el('results').innerHTML=''};el('calc').onclick=()=>{el('status').textContent='';el('results').innerHTML='';const T=Number(el('temp').value);if(!horses.length||!Number.isFinite(T)||T<=0){el('status').textContent='馬を追加し、Tを0より大きく設定してな。';return}if(horses.some(h=>!h.name.trim()||h.scores.some(s=>!Number.isFinite(s)||s<0||s>5))){el('status').textContent='全馬の名前と0〜5点の評価を入力してな。';return}const w=weights[el('mode').value];const rows=horses.map(h=>({name:h.name,index:h.scores.reduce((sum,s,j)=>sum+s*w[j]/5,0)}));const max=Math.max(...rows.map(r=>r.index));const e=rows.map(r=>Math.exp((r.index-max)/T));const sum=e.reduce((a,b)=>a+b,0);rows.forEach((r,i)=>r.p=100*e[i]/sum);rows.sort((a,b)=>b.p-a.p);el('results').innerHTML=`<h3>${escapeHTML(el('race').value)}：${rows.length}頭</h3>`+rows.map((r,i)=>`<div class="horse"><div class="rank">${['◎','○','▲'][i]||i+1+'位'} ${escapeHTML(r.name)} <span style="float:right">${r.p.toFixed(1)}%</span></div><div class="small">指数 ${r.index.toFixed(1)} / 100</div><div class="bar"><div style="width:${r.p}%"></div></div></div>`).join('')};el('sample').click();
</script></body></html>
